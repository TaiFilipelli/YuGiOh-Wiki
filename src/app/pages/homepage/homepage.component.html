<body class="body">
    <h1>YuGiOh Wiki</h1>
    <h2>Click wichever cart you want to see more details</h2>
    <input type="text" placeholder="Search cart..." [formControl]="name">
    <section class="cardsList" infiniteScroll [infiniteScrollDistance]="2" [infiniteScrollThrottle]="50" (scrolled)="onScroll()">
        @for (card of cards; track $index) {
            <app-card [card]="card"></app-card>
        }
    </section>
</body>
